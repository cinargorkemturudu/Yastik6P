[project]
name = "yastik6p"
version = "0.1.0"
description = "Python port of the Yastık6 price shield, built as a learning project."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "spyder-kernels>=3.1,<3.2"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
